# CI runs the same gate as the local checks (`pnpm check`) plus the packed-tarball
# smoke test, on pull requests and pushes to the permanent branches, and by hand
# (Actions tab -> CI -> "Run workflow", or `gh workflow run ci.yml --ref <branch>`).
# See `.agents/skills/git-workflow/SKILL.md` ("Local checks" and "CI/CD status").
#
# `check` is not yet a required status check on the branch ruleset; the owner adds
# it once it has gone green on a pull request.

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: localfirst
          POSTGRES_PASSWORD: localfirst-ci
          POSTGRES_DB: localfirst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localfirst -d localfirst_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://localfirst:localfirst-ci@127.0.0.1:5432/localfirst_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm --filter localfirstdotsh test:package
