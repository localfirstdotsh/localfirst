# CI is SUSPENDED for the Localfirst MVP development phase.
#
# Automatic triggers are commented out below, not deleted: this workflow runs
# only when started by hand (Actions tab -> CI -> "Run workflow", or
# `gh workflow run ci.yml --ref <branch>`). Nothing is enforced automatically,
# so agents run the local checks before opening a PR instead — see
# `.agents/skills/git-workflow/SKILL.md` ("Local checks" and "CI/CD status").
#
# TO RESTORE AUTOMATED CI (checklist in SKILL.md § "Restoring CI/CD"):
#   1. Uncomment the `pull_request` and `push` blocks under `on:`.
#      Keep `workflow_dispatch` so manual runs stay possible.
#   2. Confirm GitHub Actions can execute on the account — as of
#      2026-10-11 jobs are rejected with "recent account payments have
#      failed or your spending limit needs to be increased".
#   3. Push the branch, open a PR, and confirm the `check` job goes green
#      before anyone depends on it.
#   4. Only then require it as a status check (see
#      `.agents/skills/git-workflow/reference/ruleset.json`), which also
#      needs the repo public or on a paid plan.

name: CI

on:
  workflow_dispatch:
  # Suspended for MVP development — restore by uncommenting (see header):
  # pull_request:
  #   branches: [main, staging, dev]
  # push:
  #   branches: [main, staging, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: localfirst
          POSTGRES_PASSWORD: localfirst-ci
          POSTGRES_DB: localfirst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localfirst -d localfirst_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://localfirst:localfirst-ci@127.0.0.1:5432/localfirst_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
